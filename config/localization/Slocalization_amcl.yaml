amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.1 #    Expected process noise in odometry’s rotation estimate from rotation.
    alpha2: 0.001 #    Expected process noise in odometry’s rotation estimate from translation.   
    alpha3: 0.05 #    Expected process noise in odometry’s translation estimate from translation.
    alpha4: 0.001 #    Expected process noise in odometry’s translation estimate from rotation.
    base_frame_id: base_link
    global_frame_id: map
    laser_model_type: likelihood_field
    odom_frame_id: odom
    max_beams: 100
    max_particles: 2000
    min_particles: 500
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.5
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    map_topic : /map
    scan_topic: /scan
    set_initial_pose: True
    initial_pose:
      # record2
      x : 5.343
      y : 22.219
      yaw: 1.3
